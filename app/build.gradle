plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rekha.fitnesstracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.rekha.fitnesstracker"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No third-party dependencies: the UI is a single HTML file in src/main/assets.
